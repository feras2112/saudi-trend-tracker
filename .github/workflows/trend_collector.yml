name: Automated Saudi F&B Trend Collector

on:
  schedule:
    # Run automatically every 6 hours to capture fresh social trends
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS F&B Social Trend Collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python collectors/rss_collector.py
